pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

def localAapCore = file("../aap-core")
def useLocalAapCoreBuild = providers.gradleProperty("useLocalAapCoreBuild").map { it.toBoolean() }.orElse(false).get()
if (useLocalAapCoreBuild && localAapCore.exists() && file("../aap-core/settings.gradle").exists()) {
    includeBuild("../aap-core")
}

rootProject.name = "aap-ara"
include(":androidaudioplugin-ara")
include(":samples:aaparahostsample")
include(":samples:aaparapluginsample")
