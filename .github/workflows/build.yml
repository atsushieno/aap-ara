name: build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: set up Android SDK
        uses: android-actions/setup-android@v3
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: build
        run: ./gradlew --console=plain build dokkaGenerate publishToMavenLocal
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aap-ara-apps-and-libs-${{ matrix.os }}
          if-no-files-found: error
          path: |
            androidaudioplugin-ara/build/outputs/aar/*.aar
            samples/*/build/outputs/apk/debug/*.apk
            androidaudioplugin-ara/build/dokka/html/
